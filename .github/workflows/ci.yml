name: ci

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Security: Apply principle of least privilege
# This workflow runs CI checks on main and manages Changesets release PRs
permissions:
  contents: write      # Required for changesets/action to push the release branch
  id-token: write      # Required for OIDC token generation
  pull-requests: write # Required for changesets/action to create/update release PRs

jobs:
  release-action:
    name: Validate and manage Release PR
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      hasChangesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      # Checkout repository with full history for changeset processing
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Configure git user for commits made by the workflow
      - name: Configure git user (trigger actor) 
        uses: $/.github/workflows/actions/config-git-user
      
      # Install dependencies and setup Node.js environment
      - name: Setup node and install deps
        uses: $/.github/workflows/actions/node-setup

      # Run tests to ensure quality before release
      - name: Run tests
        run: pnpm run test:ci

      # Run linting to ensure code quality
      - name: Run linter
        run: pnpm run lint

      # Build and package the action with latest source changes
      - name: Build and package action
        run: pnpm run build

      # Process changesets: create or update the version Release PR when changesets are present
      - name: Create or update Release Pull Request
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          pr-title: '🤖 Release - Fusion Action App Publish'
          create-github-releases: false
          push-with-git-cli: true
          version-script: pnpm run changeset:version
          github-token: ${{ github.token }}

      # Convert changeset PR to draft to prevent accidental merging
      - name: Convert Changeset PR to draft
        if: steps.changesets.outputs.published == 'false' && steps.changesets.outputs.pr-number
        run: gh pr ready ${{ steps.changesets.outputs.pr-number }} --undo
        env:
          GH_TOKEN: ${{ github.token }}
          
